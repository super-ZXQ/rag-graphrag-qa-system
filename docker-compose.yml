name: scholargraph

# 依赖：宿主机 Ollama（默认 host.docker.internal:11434）提供 embedding。
# 密钥只通过 .env.local / 环境变量注入，不写入镜像。
services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
  neo4j:
    image: neo4j:5.26.30-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-change-me-123}
    volumes:
      - neo4j-data:/data

  api:
    build: .
    command: uvicorn api.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - path: .env.local
        required: false
    environment:
      # Docker 内走 Qdrant 服务，不使用本地持久化路径
      QDRANT_PATH: ""
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    volumes:
      - ./data:/app/data
    depends_on:
      qdrant:
        condition: service_started
      neo4j:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  ui:
    build: .
    command: streamlit run ui/app.py --server.address 0.0.0.0 --server.port 8501 --server.headless true
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_started

volumes:
  qdrant-data:
  neo4j-data:
